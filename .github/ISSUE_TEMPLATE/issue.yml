name: 이슈 (기능 · 버그 · 조사 · 결정)
description: 작업을 현재 상태에서 검증 가능한 목표 상태로 전이시키는 공용 템플릿
title: "[영역] "
body:
  - type: textarea
    id: summary
    attributes:
      label: 요약
      description: 무엇을 바꾸거나 확인하려는지 한두 문장으로 작성합니다.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 유스 케이스 또는 의사결정 맥락
      description: 사용자, 운영, 조사 또는 설계 관점에서 이 작업이 필요한 이유를 작성합니다.
    validations:
      required: false
  - type: textarea
    id: condition
    attributes:
      label: 발생 또는 적용 조건
      description: 버그는 재현 단계, 기능은 대상 상황, 조사·결정은 해결할 질문과 제약을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: current-state
    attributes:
      label: 현재 상태
      description: 지금 시스템의 동작, 부재, 알려진 사실 또는 불확실성을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: desired-state
    attributes:
      label: 목표 상태
      description: 작업 뒤의 기대 동작, 확정할 결정 또는 얻을 근거를 작성합니다.
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: 기대 이점
      description: 누구에게 왜 도움이 되는지 작성합니다.
    validations:
      required: false
  - type: textarea
    id: requirements
    attributes:
      label: 요구사항 및 범위
      description: 반드시 포함할 조건, 제외할 범위, 관련 요구사항 번호를 작성합니다.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: 완료 조건 및 검증 방법
      description: 산출물, 테스트, 확인 명령, 관찰 가능한 완료 기준을 작성합니다.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 관련 링크 및 참조
      description: 관련 Issue, 문서, 코드 위치, 벤치마크, 이미지 등을 작성합니다.
    validations:
      required: false
