services:
  stt:
    image: ghcr.io/ggml-org/whisper.cpp:main-vulkan
    entrypoint: ["whisper-server"]
    command: ["--model", "/models/${STT_MODEL_FILE:?Set STT_MODEL_FILE}", "--language", "ko", "--no-gpu", "--host", "0.0.0.0", "--port", "8081"]
    volumes:
      - ${STT_MODEL_DIR:?Set STT_MODEL_DIR}:/models:ro
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
  tts:
    build:
      context: .
      dockerfile: Dockerfile.melotts-probe
    image: winter-ai:melotts-probe
    entrypoint: ["python", "/opt/probe/melotts_http_server.py"]
    volumes:
      - ${TTS_CACHE_DIR:?Set TTS_CACHE_DIR}:/root/.cache:rw
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
