services:
  reference-source-probe:
    build:
      context: .
      dockerfile: Dockerfile.reference-source-probe
    image: winter-ai:reference-source-probe
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspace:ro
      - ${REFERENCE_STORAGE_ROOT:?REFERENCE_STORAGE_ROOT is required}:/reference-data
    environment:
      REFERENCE_STORAGE_ID: ${REFERENCE_STORAGE_ID:?REFERENCE_STORAGE_ID is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace/src
      YTDLP_NO_PLUGINS: "1"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # Same pinned runtime, different entrypoint. This one writes subtitle text
  # into external storage, so it does not share the metadata probe's contract
  # of producing no files at all.
  reference-subtitle-probe:
    build:
      context: .
      dockerfile: Dockerfile.reference-source-probe
    image: winter-ai:reference-source-probe
    entrypoint: ["python3", "/workspace/experiments/reference_subtitle_probe.py"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspace:ro
      - ${REFERENCE_STORAGE_ROOT:?REFERENCE_STORAGE_ROOT is required}:/reference-data
    environment:
      REFERENCE_STORAGE_ID: ${REFERENCE_STORAGE_ID:?REFERENCE_STORAGE_ID is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace/src
      YTDLP_NO_PLUGINS: "1"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"

  # The only service here that stores real media. Audio only, no re-encode:
  # the image ships without ffmpeg so the original stream is kept as delivered.
  reference-audio-ingest:
    build:
      context: .
      dockerfile: Dockerfile.reference-source-probe
    image: winter-ai:reference-source-probe
    entrypoint: ["python3", "/workspace/experiments/reference_audio_ingest.py"]
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - .:/workspace:ro
      - ${REFERENCE_STORAGE_ROOT:?REFERENCE_STORAGE_ROOT is required}:/reference-data
    environment:
      REFERENCE_STORAGE_ID: ${REFERENCE_STORAGE_ID:?REFERENCE_STORAGE_ID is required}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace/src
      YTDLP_NO_PLUGINS: "1"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
