services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: winter-ai:dev
    working_dir: /workspace
    # Keep bind-mounted private data owned by the Host user, not container root.
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - .:/workspace
      - ./data:/workspace/data
      - ./models:/workspace/models
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    stdin_open: true
    tty: true
    command: ["bash"]
