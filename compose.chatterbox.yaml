services:
  chatterbox:
    image: winter-ai:chatterbox
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    gpus: all
    entrypoint: ["python", "/probe/chatterbox_server.py"]
    volumes:
      - ./experiments:/probe:ro
      # A host path rather than a named volume: named volumes are created
      # root-owned and this runs as the caller, which is how the last stage-1
      # server died before it could load.
      - ${CHATTERBOX_CACHE:-${HOME}/.cache/winter-ai/chatterbox}:/cache
    ports:
      - "127.0.0.1:8093:8093"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
