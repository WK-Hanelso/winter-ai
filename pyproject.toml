[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "winter-ai"
version = "0.1.0"
description = "A local-first personal companion."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
winter = "companion.user_cli:main"

[project.optional-dependencies]
# numpy is the exception to keeping the dev image thin. torch and speechbrain
# are gigabytes and stay in their own images; numpy is tens of megabytes, and
# without it the audio-alignment experiments cannot be tested offline at all.
dev = ["pytest>=8.0", "ruff>=0.9", "mypy>=1.14", "numpy>=1.26,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
# E,F: pyflakes와 pycodestyle 기본. I: import 정렬. UP: 낡은 문법.
# B: 흔한 함정(mutable default, loop 변수 capture 등).
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["companion"]
# 기존 코드가 `from dataclasses import dataclass`와 `import json`을 한 블록에
# 섞어 쓰는 stdlib 스타일을 따른다. 이를 유지해 대량 재정렬을 피한다.
force-sort-within-sections = true

[tool.mypy]
python_version = "3.11"
files = ["src", "experiments"]
mypy_path = "src"
# experiments/는 package가 아니라 독립 실행 script 모음이다. 이 두 옵션이 없으면
# 같은 파일이 `tts_probe`와 `experiments.tts_probe` 두 이름으로 잡혀 검사가 중단된다.
explicit_package_bases = true
namespace_packages = true
# Domain 계층의 계약을 강제하는 것이 목적이다. 아래 세 가지가 핵심이며
# 나머지 strict 옵션은 기존 코드 위반량을 확인한 뒤 단계적으로 켠다.
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true

# melo.api는 Dockerfile.melotts-probe 전용 image에만 설치된다. dev image에 넣으면
# 오프라인 테스트 환경이 무거워지므로, 이 probe runner에서만 stub 부재를 허용한다.
[[tool.mypy.overrides]]
module = "melo.*"
ignore_missing_imports = true

# torch, torchaudio and speechbrain live only in Dockerfile.speaker-embedding.
# Installing them in the dev image would add gigabytes to every offline test run.
# soundfile and the GPT-SoVITS package live only in Dockerfile.gpt-sovits. The
# runner that imports them never executes in the dev image.
[[tool.mypy.overrides]]
module = ["soundfile.*", "GPT_SoVITS.*", "huggingface_hub.*", "cosyvoice.*", "torchaudio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["torch.*", "torchaudio.*", "speechbrain.*", "nemo.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src/companion"]
