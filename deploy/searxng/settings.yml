# Winter local web search (P8). Local-only SearXNG: no API key, no monthly cap.
# JSON output must be enabled explicitly; the default image only serves HTML.
use_default_settings: true
general:
  instance_name: "winter-search"
  debug: false
server:
  secret_key: "winter-local-searxng-not-exposed"
  bind_address: "127.0.0.1"
  port: 8080
  limiter: false
  image_proxy: false
search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ko-KR"
  formats:
    - html
    - json
ui:
  static_use_hash: true
