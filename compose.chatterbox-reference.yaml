services:
  chatterbox:
    image: winter-ai:chatterbox-v3
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    gpus: all
    entrypoint: ["python", "/probe/chatterbox_server.py"]
    command:
      - --half
      - "${CHATTERBOX_HALF-}"
      - --conditioning
      - s3gen-reference
      - --reference
      - /reference/chosen-prompt.wav
    environment:
      PYTHONPATH: /winter-src
    volumes:
      - ./experiments:/probe:ro
      - ./src:/winter-src:ro
      - ${CHATTERBOX_CACHE:-${HOME}/.cache/winter-ai/chatterbox}:/cache
      - ${CHATTERBOX_REFERENCE:?Set CHATTERBOX_REFERENCE to the chosen Reference WAV}:/reference/chosen-prompt.wav:ro
    ports:
      - "127.0.0.1:8093:8093"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
